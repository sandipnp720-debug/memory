<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --accent-primary: #818cf8;
  --accent-secondary: #c084fc;
  --bg-body: #0a0e17;
  --bg-container: rgba(22, 29, 42, 0.7);
  --border-glass: rgba(255, 255, 255, 0.08);
  --match-glow: #22c55e;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

/* Base styling */
* { box-sizing: border-box; font-family: 'Urbanist', sans-serif; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background-color: var(--bg-body);
  background-image: radial-gradient(circle at top left, #1e1b4b, transparent 40%), radial-gradient(circle at bottom right, #1a153a, transparent 40%);
  color: var(--text-main);
}

/* Container */
.container {
  background-color: var(--bg-container);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 40px;
  border-radius: 32px;
  border: 1px solid var(--border-glass);
  width: 100%;
  max-width: 480px;
  text-align: center;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
  position: relative;
}

/* Heading */
h2 {
  font-size: 32px;
  font-weight: 800;
  margin-bottom: 30px;
  letter-spacing: -1.5px;
  background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Stats */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 30px;
}

.stat-box {
  background: rgba(0,0,0,0.2);
  padding: 12px;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.05);
}

.stat-label {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.stat-value {
  font-size: 20px;
  font-weight: 700;
  color: #fff;
}

/* Progress bar */
.progress-bar {
  height: 8px;
  background: #1e293b;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 6px;
}

#progressFill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
  transition: width 0.4s;
}

/* Game grid */
.game {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  perspective: 1200px;
}

/* Card styling */
.card {
  width: 100%;
  aspect-ratio: 1/1;
  cursor: pointer;
  position: relative;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
  transform: scale(1.05) rotateZ(1deg);
  box-shadow: 0 0 10px var(--accent-primary), 0 0 20px var(--accent-primary), 0 0 30px rgba(129,140,248,0.6);
}

.card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.34,1.56,0.64,1);
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}

.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 16px;
  border: 2px solid transparent;
  overflow: hidden;
  transition: border-color 0.3s;
  box-shadow: inset 0 0 10px rgba(255,255,255,0.05), 0 0 10px rgba(0,0,0,0.5);
}

.card-front {
  background: #2a3346;
  background-image: radial-gradient(circle at center, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 10px 10px;
  border: 1px solid rgba(255,255,255,0.1);
}

.card-back {
  transform: rotateY(180deg);
}

.card-back img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card.matched .card-face {
  border-color: var(--match-glow);
  box-shadow: 0 0 15px rgba(34,197,94,0.3);
  opacity: 0.7;
}

/* Button */
.btn-restart {
  margin-top: 30px;
  width: 100%;
  padding: 16px;
  border-radius: 16px;
  border: none;
  font-size: 16px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  color: white;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 10px 20px -5px rgba(129,140,248,0.5);
}

.btn-restart:hover {
  background: #6366f1;
  transform: translateY(-2px);
}

/* Win modal */
#congratsOverlay {
  position: absolute;
  inset: 0;
  background: rgba(10,14,23,0.95);
  backdrop-filter: blur(10px);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
  border-radius: 32px;
  padding: 20px;
}

#congratsOverlay .modal-content h2 {
  margin-bottom: 10px;
  font-weight: 800;
  color: white;
}

#congratsOverlay .modal-content p {
  color: var(--text-muted);
  margin-bottom: 25px;
  font-size: 16px;
}

#congratsOverlay .modal-content button {
  padding: 12px 30px;
}
</style>
</head>
<body>
<div class="container">
  <h2>Memory Match</h2>
  
  <div class="stats-grid">
    <div class="stat-box">
      <span class="stat-label">Timer</span>
      <span class="stat-value" id="time">0s</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Moves</span>
      <span class="stat-value" id="moves">0</span>
    </div>
    <div class="stat-box">
      <span class="stat-label">Progress</span>
      <div class="progress-bar">
        <div id="progressFill"></div>
      </div>
    </div>
  </div>
  
  <div class="game" id="game"></div>
  
  <button class="btn-restart" onclick="restartGame()">Restart</button>
  
  <div id="congratsOverlay">
    <div class="modal-content">
      <h2>🎉 Victory! 🎉</h2>
      <p>You matched all 6 pairs perfectly.</p>
      <button class="btn-restart" onclick="closeCongrats()">Play Again</button>
    </div>
  </div>
</div>

<audio id="flipSound" src="flip.mp3"></audio>
<audio id="winSound" src="win.mp3"></audio>

<script>
const images = [
  'images/photo1.webp', 'images/photo2.jfif', 'images/photo3.jfif',
  'images/photo4.jfif', 'images/photo5.jpg', 'images/photo6.jpg'
];

const gameContainer = document.getElementById("game");
let firstCard = null, secondCard = null, lock = false;
let moves = 0, right = 0, time = 0, timer = null, active = false;

function shuffle(arr) { return arr.sort(() => Math.random() - 0.5); }

function updateStats() {
  document.getElementById("moves").innerText = moves;
  document.getElementById("time").innerText = time + "s";
  document.getElementById("progressFill").style.width = (right / 6 * 100) + "%";
}

function createBoard() {
  gameContainer.innerHTML = "";
  const shuffledSet = shuffle([...images, ...images]);
  shuffledSet.forEach(src => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-front"></div>
        <div class="card-face card-back"><img src="${src}"></div>
      </div>`;
    card.addEventListener("click", () => flip(card));
    gameContainer.appendChild(card);
  });
}

function flip(card) {
  if (lock || card === firstCard || card.classList.contains("matched")) return;
  document.getElementById("flipSound").play().catch(()=>{});
  if (!active) {
    active = true;
    timer = setInterval(() => { time++; updateStats(); }, 1000);
  }
  card.classList.add("flipped");
  if (!firstCard) { firstCard = card; return; }
  secondCard = card;
  moves++;
  updateStats();
  check();
}

function check() {
  const isMatch = firstCard.querySelector("img").src === secondCard.querySelector("img").src;
  if (isMatch) {
    firstCard.classList.add("matched");
    secondCard.classList.add("matched");
    right++;
    updateStats();
    if (right === images.length) finish();
    resetState();
  } else {
    lock = true;
    setTimeout(() => {
      firstCard.classList.remove("flipped");
      secondCard.classList.remove("flipped");
      resetState();
    }, 1000);
  }
}

function resetState() { [firstCard, secondCard, lock] = [null, null, false]; }

function finish() {
  clearInterval(timer);
  document.getElementById("winSound").play().catch(()=>{});
  document.getElementById("congratsOverlay").style.display = "flex";
}

function restartGame() {
  clearInterval(timer);
  [moves, right, time, active] = [0, 0, 0, false];
  document.getElementById("congratsOverlay").style.display = "none";
  updateStats();
  createBoard();
}

function closeCongrats() { restartGame(); }

createBoard();
</script>
</body>
</html>
